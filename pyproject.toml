[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "catia-diff"
version = "0.1.0"
description = "Multi-agent audit system for 2D technical drawings (missing/inconsistent dimensions, tolerances, GD&T and title-block defects)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "catia_diff contributors" }]
keywords = ["cad", "technical-drawing", "gd&t", "iso", "asme-y14.5", "dxf", "pdf", "agents"]

dependencies = [
  "pydantic>=2.6,<3",
]

[project.optional-dependencies]
# Vector CAD ingestion (DXF).
dxf = ["ezdxf>=1.1"]
# PDF parsing + page rasterisation.
pdf = ["pymupdf>=1.24"]
# Raster pre-processing and overlay rendering.
raster = ["pillow>=10.0", "numpy>=1.24"]
cv = ["opencv-python-headless>=4.9"]
# Claude Vision extraction for scanned drawings.
llm = ["anthropic>=1.0"]
# HTML report rendering.
report = ["jinja2>=3.1"]
# Browser dashboard (Dash + Plotly).
ui = ["dash>=2.17"]
# Everything needed for the documented end-to-end flow.
all = [
  "ezdxf>=1.1",
  "pymupdf>=1.24",
  "pillow>=10.0",
  "numpy>=1.24",
  "opencv-python-headless>=4.9",
  "anthropic>=1.0",
  "jinja2>=3.1",
  "dash>=2.17",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
catia-diff = "catia_diff.cli:main"
tdaudit = "catia_diff.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
catia_diff = ["reporting/templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
